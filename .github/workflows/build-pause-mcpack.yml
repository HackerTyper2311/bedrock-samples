name: Build Custom Pause Button MCPack

on:
  push:
    branches:
      - demo-pause-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_pause_pack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('manifest.json'), Path('ui/_ui_defs.json'), Path('ui/pause_screen.json')]:
              json.loads(p.read_text(encoding='utf-8'))
              print('OK:', p)
          PY

      - name: Build MCPack
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f Custom_Pause_Buttons.mcpack
          cd custom_pause_pack
          zip -r "$GITHUB_WORKSPACE/Custom_Pause_Buttons.mcpack" .

      - name: Verify MCPack
        run: |
          test -f "$GITHUB_WORKSPACE/Custom_Pause_Buttons.mcpack"
          unzip -t "$GITHUB_WORKSPACE/Custom_Pause_Buttons.mcpack"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Pause-Buttons-mcpack
          path: ${{ github.workspace }}/Custom_Pause_Buttons.mcpack
          if-no-files-found: error

      - name: Create demo release
        if: github.ref_name == 'demo-pause-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="demo-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$GITHUB_WORKSPACE/Custom_Pause_Buttons.mcpack" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom Pause Buttons Demo $TAG" \
            --notes "Demo MCPack generated by GitHub Actions. Changes only the pause button background and hover texture." \
            --prerelease
